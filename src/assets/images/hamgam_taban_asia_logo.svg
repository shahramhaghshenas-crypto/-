<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Background Sky Blue Gradient -->
    <linearGradient id="skyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b8ffc"/>
      <stop offset="45%" stop-color="#2179ec"/>
      <stop offset="85%" stop-color="#1864cc"/>
      <stop offset="100%" stop-color="#1251ab"/>
    </linearGradient>

    <!-- Sun flare / glow gradients -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="25%" stop-color="#e0f2fe" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#7dd3fc" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="flareRay" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- 3D Gradients for Blue Logo Part -->
    <linearGradient id="blueFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1d5ec4"/>
      <stop offset="50%" stop-color="#0e49a8"/>
      <stop offset="100%" stop-color="#083680"/>
    </linearGradient>
    <linearGradient id="blueTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4d8df5"/>
      <stop offset="100%" stop-color="#246be6"/>
    </linearGradient>

    <!-- 3D Gradients for Red Logo Part -->
    <linearGradient id="redFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f42b2b"/>
      <stop offset="50%" stop-color="#dc1818"/>
      <stop offset="100%" stop-color="#ab0909"/>
    </linearGradient>
    <linearGradient id="redTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="100%" stop-color="#f83b3b"/>
    </linearGradient>

    <!-- Text 3D Blue Gradient -->
    <linearGradient id="textBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d3b8e"/>
      <stop offset="100%" stop-color="#062259"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="mainShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#031638" flood-opacity="0.45"/>
    </filter>
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#031638" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Sky Canvas -->
  <rect width="1024" height="1024" fill="url(#skyBg)"/>

  <!-- Sun Glow Lens Effect (Top Right) -->
  <g transform="translate(790, 230)">
    <circle cx="0" cy="0" r="220" fill="url(#sunGlow)"/>
    <!-- Sun rays -->
    <rect x="0" y="-3" width="280" height="6" fill="url(#flareRay)" transform="rotate(-30)"/>
    <rect x="0" y="-3" width="220" height="6" fill="url(#flareRay)" transform="rotate(15)"/>
    <rect x="0" y="-3" width="250" height="6" fill="url(#flareRay)" transform="rotate(60)"/>
    <rect x="0" y="-3" width="190" height="6" fill="url(#flareRay)" transform="rotate(-75)"/>
  </g>

  <!-- Main H Logo Symbol Group -->
  <g filter="url(#mainShadow)">
    <!-- LEFT BLUE SECTION -->
    <!-- Base Front Face -->
    <path d="M 310 248 L 444 248 L 444 358 L 508 358 L 434 478 L 310 478 Z" fill="url(#blueFront)"/>
    <!-- Top 3D Bevel -->
    <path d="M 310 248 L 444 248 L 444 262 L 324 262 Z" fill="url(#blueTop)"/>
    <!-- Inner Seam Highlight -->
    <path d="M 508 358 L 434 478 L 424 478 L 498 358 Z" fill="#3b82f6" opacity="0.7"/>

    <!-- RIGHT RED SECTION -->
    <!-- Base Front Face -->
    <path d="M 508 358 L 578 358 L 578 248 L 712 248 L 712 478 L 578 478 L 578 372 Z" fill="url(#redFront)"/>
    <!-- Top 3D Bevel -->
    <path d="M 578 248 L 712 248 L 712 262 L 592 262 Z" fill="url(#redTop)"/>
    <!-- Seam Shadow -->
    <path d="M 508 358 L 578 358 L 578 372 L 508 372 Z" fill="#881337" opacity="0.6"/>
  </g>

  <!-- HAMGAM TABAN ASIA TEXT -->
  <g filter="url(#textShadow)" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, Helvetica, sans-serif" font-weight="900" fill="url(#textBlue)">
    <text x="512" y="628" font-size="110" letter-spacing="4">HAMGAM</text>
    <text x="512" y="748" font-size="96" letter-spacing="5">TABAN ASIA</text>
  </g>
</svg>
